#cloud-config

packages:
  - openssh-server

runcmd:
  - sshd -t
  - systemctl enable --now sshd
  - |
    if systemctl is-active --quiet firewalld; then
      firewall-cmd --permanent --add-service=ssh
      firewall-cmd --reload
    fi

ssh_pwauth: true

users:
  - name: rocky
    groups:
      - wheel
    lock_passwd: false
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  hardev.sanghera@nutanix.com
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
  - name: rockyadmin
    groups:
      - wheel
    lock_passwd: false
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  hardev.sanghera@nutanix.com
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"

chpasswd:
  list: |
    rocky:Nutanix/4u
    rockyadmin:Nutanix/4u
  expire: false